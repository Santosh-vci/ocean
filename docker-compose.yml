name: ${COMPOSE_PROJECT_NAME:-coalflow}

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coalflow}
      POSTGRES_USER: ${POSTGRES_USER:-coalflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coalflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coalflow} -d ${POSTGRES_DB:-coalflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coalflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-coalflow-dev-password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-store-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://object-store:9000 ${MINIO_ROOT_USER:-coalflow} ${MINIO_ROOT_PASSWORD:-coalflow-dev-password} &&
      mc mb --ignore-existing local/${S3_BUCKET_NAME:-coalflow-local}
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      RUN_STARTUP_TASKS: "1"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      RUN_STARTUP_TASKS: "0"
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --timeout 5 | grep -q pong",
        ]
      interval: 20s
      timeout: 10s
      retries: 10

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      RUN_STARTUP_TASKS: "0"
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; os.kill(1, 0)",
        ]
      interval: 20s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.23
    profiles: ["devtools"]
    ports:
      - "1025:1025"
      - "8025:8025"

  flower:
    image: mher/flower:2.0
    profiles: ["devtools"]
    env_file:
      - .env
    command: celery --broker=${CELERY_BROKER_URL:-redis://redis:6379/0} flower --port=5555
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
